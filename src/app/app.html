<div class="shell">
  <aside class="sidebar">
    <div class="perfil">
      <span class="avatar">D</span>
      <div><p class="perfil-nombre">Dragos</p><p class="perfil-rol">Búsqueda de empleo</p></div>
    </div>
    <nav class="menu">
      @for (m of menu; track m.ruta) {
        <a class="pill" [routerLink]="m.ruta" routerLinkActive="activa">
          <span class="material-symbols-outlined">{{ m.icono }}</span><span>{{ m.texto }}</span>
        </a>
      }
    </nav>
    <button class="pill pill-boton" type="button" (click)="tema.alternar()">
      <span class="material-symbols-outlined">{{ tema.oscuro() ? 'light_mode' : 'dark_mode' }}</span>
      <span>{{ tema.oscuro() ? 'Modo claro' : 'Modo oscuro' }}</span>
    </button>
  </aside>

  <main class="contenido"><router-outlet /></main>

  <nav class="bottom">
    @for (m of menu; track m.ruta) {
      <a [routerLink]="m.ruta" routerLinkActive="activa">
        <span class="material-symbols-outlined">{{ m.icono }}</span><span>{{ m.texto }}</span>
      </a>
    }
    <button type="button" (click)="tema.alternar()" aria-label="Cambiar tema">
      <span class="material-symbols-outlined">{{ tema.oscuro() ? 'light_mode' : 'dark_mode' }}</span><span>Tema</span>
    </button>
  </nav>
</div>
